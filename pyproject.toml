[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "sabermath"
description = "SABER-Math: A Benchmark for Deep Mathematical understanding of Embedding models"
requires-python = ">=3.10"
dynamic = ["version"]
license = "CC-BY-SA-4.0"

dependencies = [
    "sentence-transformers>=5.4.1",
    "numpy>=2.2.6,<2.3; python_version < '3.11'",
    "numpy>=2.4.4; python_version >= '3.11'",
    "tqdm>=4.67.3",
    "datasets>=4.8.5"
]

[project.optional-dependencies]
# PINNED, mirroring scripts/envs/env_vllm.yml (see the warning there): every
# vLLM recipe in this repo - pooler_config kwarg name, the Qwen3-Reranker
# SeqCls conversion, the LlamaBidirectionalModel remap - was validated on
# exactly 0.26.0, and kwarg spellings differ on other versions. Bump
# deliberately, and re-validate each affected model against a raw-HF reference
# before trusting the numbers; the previous verdicts are archived in
# results/diagnostics/vllm_feasibility/summary.json.
vllm = [
    "vllm==0.26.0",
    "flashinfer-python==0.6.14"
]

apis = [
    "google-genai>=1.74.0",
    "openai>=2.33.0"
]

# The lexical baselines: TF-IDF, BM25, Jaccard and Approach Zero.
lexical = [
    "scikit-learn>=1.7,<1.8; python_version < '3.11'",
    "scikit-learn>=1.7; python_version >= '3.11'",
    "rank-bm25>=0.2.2",
    "pya0==0.3.7; platform_system == 'Linux'"
]

# Deprecated alias for "lexical", kept so existing install commands and
# cluster environment files keep working. These baselines were never legacy in
# the sense the name suggested - they are reported in the paper.
legacy = [
    "sabermath[lexical]"
]

# Custom-scoring rerankers (rank1, Qwen3-Reranker, GTE/Reason-ModernColBERT,
# ReasonIR, SPLADE) - see src/sabermath/processors/. rank1 additionally needs
# the "vllm" extra; ReasonIR and SPLADE only need the base dependencies plus
# this pin (both require trust_remote_code=True at run time).
rerankers = [
    "pylate>=1.0",
    "transformers>=4.51.0",
    "torch>=2.2",
    # RaDeR's reranker ships as a LoRA SEQ_CLS adapter - see
    # src/sabermath/processors/rader_reranker_processor.py.
    "peft>=0.14"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "sabermath.__version__.__version__" }
