# For: GTE-ModernColBERT / Reason-ModernColBERT (both need pylate) in
# math-vs-word's calc_sims.py --method <hf-repo> run.
#
# Mirrors scripts/rerankers/envs/env_colbert.yml EXACTLY, plus tqdm for
# calc_sims.py's own progress bars - see that file's own header for why the
# postinstall ORDER matters: pylate==1.6.0 declares an exact dependency on
# sentence-transformers==5.3.0, and installing it in the same pip call as
# `pip install -e .` (whose sentence-transformers>=5.4.1 floor wins pip's
# resolver) silently upgrades past that, breaking
# pylate.models.Dense.from_sentence_transformers() with
# `KeyError: 'activation_function'`. This is why this is a postinstall
# SCRIPT (sequential `pip install` calls) rather than math-vs-word's usual
# plain `dependencies: - pip: [...]` list - that list is installed as one
# unordered set, which cannot express "downgrade sentence-transformers back
# down as the LAST step".
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - pip

postinstall: |
  pip install "pylate==1.6.0" datasets numpy tqdm
  pip install -e "$SABERMATH_REPO"
  pip install "sentence-transformers==5.3.0"
