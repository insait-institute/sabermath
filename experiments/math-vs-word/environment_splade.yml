# For: SPLADE-Code-8B / SPLADE-Code-0.6B in math-vs-word's calc_sims.py
# --method <key> run. Mirrors scripts/rerankers/envs/env_splade.yml
# exactly, plus tqdm for calc_sims.py's own progress bars.
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - pip

postinstall: |
  pip install datasets numpy tqdm sentence_transformers peft
  pip install -e "$SABERMATH_REPO"
