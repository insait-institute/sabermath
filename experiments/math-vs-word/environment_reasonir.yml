# For: reasonir/ReasonIR-8B in math-vs-word's calc_sims.py --method <hf-repo>
# run. Mirrors scripts/rerankers/envs/env_reasonir.yml EXACTLY, plus tqdm for
# calc_sims.py's own progress bars - same convention as
# environment_colbert.yml / environment_splade.yml /
# environment_inf_retriever.yml.
#
# WHY THIS MODEL CANNOT USE environment.yml: that file installs
# vllm==0.26.0, which pulls a modern transformers. ReasonIR is now built by
# ReasonIRProcessor (the official trust_remote_code path - run_rerankers.py
# reverted it from vLLM on 2026-08-25 because vLLM cannot reproduce its
# instruction masking), and its bundled modeling_reasonir_8b.py accesses
# config.rope_theta directly. transformers >= 5.x refactored RoPE config and
# no longer exposes that attribute, so the model fails to construct with
# "AttributeError: 'LlamaConfig' object has no attribute 'rope_theta'".
#
# READ THIS BEFORE TRUSTING A GREEN JOB: that failure is SILENT at the SLURM
# level. env_reasonir.yml's own header documents it - only the model run
# fails, not the script, so the shell exits 0 and sacct reports COMPLETED.
# A reasonir run must be checked by target count / value drift, never by job
# state alone.
#
# The transformers pin appears TWICE on purpose, exactly as in
# env_reasonir.yml: `pip install -e "$SABERMATH_REPO"` carries a
# sentence-transformers>=5.4.1 floor that wins pip's resolver and drags
# transformers forward, so it has to be pinned back down as the LAST step.
channels:
  - conda-forge
  - nvidia
dependencies:
  - python=3.11
  - cuda-toolkit=12.9
  - parallel
postinstall: |
  pip install "transformers==4.47.1" torch datasets numpy tqdm
  pip install -e "$SABERMATH_REPO"
  pip install "transformers==4.47.1"
