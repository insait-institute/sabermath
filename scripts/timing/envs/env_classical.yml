# For: bm25, tf-idf, jaccard, approach0 (the timing harness's classical/
# lexical category - see scripts/measure_query_time.py).
#
# These four need sabermath's "legacy" extra (rank_bm25, scikit-learn,
# pya0==0.3.7 - see pyproject.toml). Base deps (sentence-transformers,
# numpy, datasets, tqdm) come along automatically since pip always
# installs the core `dependencies` list alongside any requested extra.
channels:
  - conda-forge
  - nvidia
dependencies:
  - python=3.11
  - cuda-toolkit=12.9
  - parallel
postinstall: |
  pip install -e "$SABERMATH_REPO[legacy]"
