# For: the rader-reranker-7b VERSION arm only
# (scripts/rerankers/run_rader_reranker_versions.slurm). No vllm at all -
# this is the pure HF+peft path (RaDeR's own rerank.py stack) on OLDER
# transformers/peft, roughly contemporary with the checkpoint's mid-2025
# release. The point is the LoRA merge: the trained SEQ_CLS `score` head
# arrives via modules_to_save under a non-standard key
# ("base_model.model.score.weight", not the "...modules_to_save.default..."
# peft normally writes), so a peft that mapped that key differently would
# silently leave a randomly-initialised head - and that is the one library
# failure that would explain the low score.
#
# peft is 0.15.2, not 0.14.0: 0.14 calls hf_hub_download(use_auth_token=...),
# a kwarg current huggingface_hub no longer accepts, so it cannot even read
# adapter_config.json off the Hub (confirmed 2026-08-28, job 761878:
# "TypeError: hf_hub_download() got an unexpected keyword argument
# 'use_auth_token'" -> "Can't find 'adapter_config.json'"). 0.15.2 is the
# oldest release that uses the current Hub API, so it is the furthest back
# this arm can actually reach without also pinning huggingface_hub.
channels:
  - conda-forge
  - nvidia
dependencies:
  - python=3.11
  - cuda-toolkit=12.9
postinstall: |
  pip install numpy datasets accelerate "transformers==4.51.3" "peft==0.15.2" torch
  pip install -e "$SABERMATH_REPO"
