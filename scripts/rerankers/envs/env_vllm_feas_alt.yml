# For: the rader-reranker-7b VERSION arm only
# (scripts/rerankers/run_rader_reranker_versions.slurm). Same as
# env_vllm_feas.yml but on a DIFFERENT vllm, to test whether the serving
# stack's version is what makes rader-reranker-7b score low.
#
# flashinfer is pinned to 0.6.16.post3 - the EXACT version vllm 0.27.0
# declares as a hard requirement (confirmed 2026-08-28, job 761878: pinning
# 0.6.14 here made pip fail to resolve, "vllm 0.27.0 depends on
# flashinfer-python==0.6.16.post3"). This does NOT contradict env_vllm.yml's
# warning: that warning is about leaving flashinfer UNPINNED, which lets pip
# drift onto a build that crashes at import. Pinning to the version the
# chosen vllm actually wants keeps the pairing explicit, which is the point.
channels:
  - conda-forge
  - nvidia
dependencies:
  - python=3.11
  - cuda-toolkit=12.9
  - parallel
postinstall: |
  pip install numpy datasets transformers "vllm==0.27.0" "flashinfer-python==0.6.16.post3" peft
  pip install -e "$SABERMATH_REPO"
